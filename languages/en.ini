selectedHotkey=Selected NPC shortcut
selectedHotkeyHelp=Default: Shift+L. Aim at an NPC and press to add and enable; press again to toggle. No target: no action. Takes priority over an identical player binding. Enabling also turns on the selected NPC lighting group.
followerTitle=Follower face light
followerEnabled=Enable follower face lighting
followerHelp=Automatically tracks player teammates every 0.5 seconds. Dismissed followers leave this list. Waiting teammates remain. Up to 32 loaded followers are lit, nearest first. Dialogue and selected NPC settings take priority. Custom followers require the player-teammate flag; otherwise use the selected NPC list.
firstPersonLight=Allow player light in first person
firstPersonHelp=Off by default. In first person the light follows the camera using the player light settings. The player light switch and sneak hiding still apply.
rosterNotifications=Show roster notifications
lightDiagnostics=Record player light-level diagnostics
lightDiagnosticsHelp=Read-only: one gameplay sample per second in FaceLighting.log, prefixed [LightProbe]. This checkbox alone does not enable automatic switching. Save, close the menu, then reopen to see the latest gameplay sample. Raw engine cache value, not a percentage; freshness is unknown.
probeWaiting=Waiting for a gameplay sample. Close this menu to sample.
probeMark=Mark latest sample in log
followerRowEnabled=Enable this follower light
followerRowHelp=Individual switches apply immediately and persist when you save the game, including after dismissal and re-recruitment. They only control the follower source; selected NPC and dialogue lighting remain independent.
