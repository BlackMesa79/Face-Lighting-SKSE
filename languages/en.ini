ambientDelay=Required duration (seconds)
ambientHelp=Requires the player light master switch. Live exclusion removes this mod's player and NPC light contributions without calibration; NPC switches stay independent. First activation requires saving and restarting the game. Verified Skyrim 1.6.1170 layout only. Missing or invalid readings pause decisions; no automatic fallback. Fixed compensation remains available and requires recalibration after light changes. Both modes use the thresholds and duration below.
exclusionDiagnostics=Record light-exclusion call diagnostics (restart required)
exclusionHelp=Records pairedRaw and filtered from the same player query. Logging is optional for live exclusion control; turning logging off does not disable that mode. First installation requires saving and restarting. Original game lighting and stealth cache values are preserved. Failed validation shows unavailable.
playerTransition=Smooth player light transitions
playerDuration=Player transition duration (seconds)
playerTransitionHelp=Smooths manual, dialogue and automatic switching. Default 0.2 seconds. Automatic decisions wait during fades and for 2 seconds after. Loading and disallowed camera views still clear the light immediately.

ambientFiltered=Automatic player light (live exclusion)
